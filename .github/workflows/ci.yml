name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - run: python -m build
      - name: Run the shipped regression suite from the source distribution
        env:
          REGRESSION_LOG: ${{ runner.temp }}/quark-vod-sdist-regression-${{ matrix.python-version }}.log
        run: |
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT
          tar -xzf dist/*.tar.gz -C "$scratch"
          cd "$scratch"/quark_vod-*
          test ! -e Makefile.homelab
          if make test > "$REGRESSION_LOG" 2>&1; then
            grep -E '^(Ran [0-9]+ tests?|OK|FAILED \()' "$REGRESSION_LOG" || true
          else
            python - "$REGRESSION_LOG" <<'PY'
          import pathlib, re, sys

          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          selected = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if re.match(r"^(FAIL|ERROR): ", line):
                  selected.append(line)
              if line.startswith("Traceback (most recent call last):"):
                  block = [line]
                  i += 1
                  while i < len(lines) and lines[i].strip():
                      block.append(lines[i])
                      i += 1
                  selected.extend(block[:2] + (["... traceback frames omitted ..."] if len(block) > 10 else []) + block[-8:])
              elif re.match(r"^(Ran [0-9]+ tests?|OK|FAILED \()", line):
                  selected.append(line)
              i += 1
          if not selected:
              selected = ["No unittest failure markers found; inspect uploaded regression log."]
          # Escape only the workflow-command metacharacters; cap encoded UTF-8 bytes.
          def escape(value):
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          chunks = []
          size = 0
          for line in reversed(selected):
              chunk = escape(line)
              if size + len(chunk.encode()) + 3 > 3500:
                  break
              chunks.append(chunk)
              size += len(chunk.encode()) + 3
          message = "%0A".join(reversed(chunks))
          if not message:
              message = "Failure detail exceeds annotation limit; inspect uploaded regression log."
          print("::error title=Source distribution regression failure::" + message)
          PY
            exit 1
          fi
      - name: Upload source distribution regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdist-regression-${{ matrix.python-version }}
          path: ${{ runner.temp }}/quark-vod-sdist-regression-${{ matrix.python-version }}.log
          if-no-files-found: ignore
      - name: Start both installed distributions outside the source tree
        run: |
          artifacts=("$PWD"/dist/*.whl "$PWD"/dist/*.tar.gz)
          verifier="$PWD/tests/verify_installed.py"
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT
          cd "$scratch"
          for artifact in "${artifacts[@]}"; do
            venv="$scratch/$(basename "$artifact").venv"
            python -m venv "$venv"
            "$venv/bin/python" -m pip install --no-cache-dir "$artifact"
            "$venv/bin/quark-vod" --help
            "$venv/bin/quark-vod" --version
            "$venv/bin/python" -BI "$verifier"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.python-version }}
          path: dist/*

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and inspect OCI metadata
        run: |
          VERSION="$(PYTHONPATH=app python3 -c 'from quark_vod import __version__; print(__version__)')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          docker build --build-arg VOD_VERSION="$VERSION" --build-arg VCS_REF="$GITHUB_SHA" -t quark-vod:ci .
          test "$(docker image inspect quark-vod:ci --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$VERSION"
          test "$(docker image inspect quark-vod:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect quark-vod:ci --format '{{ .Config.User }}')" = "10001:10001"
      - name: Empty non-root/read-only startup
        run: |
          docker run -d --name quark-vod-ci --read-only --memory 256m \
            --tmpfs /tmp:rw,size=32m --tmpfs /data:rw,size=16m,uid=10001,gid=10001 \
            -p 127.0.0.1:18099:8099 quark-vod:ci
          python3 - "$VERSION" <<'PY'
          import json, sys, time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:18099/health", timeout=2) as r:
                      result = json.load(r)
                      assert r.status == 200 and result["status"] == "ok" and result["version"] == sys.argv[1]
                      break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("container did not become healthy")
          PY
      - name: Cleanup
        if: always()
        run: docker rm -f quark-vod-ci
