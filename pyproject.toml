[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quark-vod"
dynamic = ["version"]
description = "Portable Quark on-demand playback with reloadable search providers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Quark-VOD contributors"}]
keywords = ["quark", "vod", "openlist", "jellyfin", "streaming"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
  "requests>=2.32,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "build>=1.2,<2"]

[project.scripts]
quark-vod = "quark_vod.cli:main"

[tool.setuptools]
package-dir = {"" = "app"}
py-modules = ["main"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["app"]
include = ["quark_vod", "quark_vod.*"]

[tool.setuptools.package-data]
quark_vod = ["static/*.html"]

[tool.setuptools.dynamic]
version = {attr = "quark_vod.__version__"}
